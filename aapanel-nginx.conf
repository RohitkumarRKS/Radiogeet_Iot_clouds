# RadioGeet IoT Platform - aaPanel / Hostinger Nginx Configuration
# Replace 'yourdomain.com' with your actual domain name.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Static Frontend App (Vite Dist)
    location / {
        root /www/wwwroot/yourdomain.com/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Node.js Express API Backend Proxy
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket Realtime Communications
    location /api/ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
